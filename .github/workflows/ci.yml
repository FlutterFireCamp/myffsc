name: Flutter CI & Quality Gate

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch_policy:
    name: 🛡️ Verify Branch Policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check Source Branch towards main
        if: github.base_ref == 'main'
        run: |
          echo "Vérification de la branche source : '${{ github.head_ref }}' vers '${{ github.base_ref }}'"
          if [[ "${{ github.head_ref }}" != "dev" && ! "${{ github.head_ref }}" =~ ^(release|hotfix)/ ]]; then
            echo "::error::❌ Fusion directe interdite vers 'main' !"
            echo "Toutes les Pull Requests vers 'main' doivent provenir de la branche 'dev' (ou d'une branche 'release/*' ou 'hotfix/*')."
            echo "Veuillez changer la branche cible de votre PR vers 'dev'."
            exit 1
          fi
          echo "✅ Branche source autorisée pour la branche de production 'main'."

  quality_gate:
    name: 🧪 Quality Gate (Format, Lint & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 📏 Verify code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: 🧹 Analyze code (0 warning/error required)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: 🧪 Run unit & BLoC tests
        run: flutter test

  build_android_check:
    name: 🤖 Android Build Verification
    runs-on: ubuntu-latest
    needs: [ quality_gate ]
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: ⚙️ Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔨 Compile Android Debug APK
        run: flutter build apk --debug
