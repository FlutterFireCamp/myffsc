name: myffsc
description: "My FFSC - Application officielle du portail apprenant du FlutterFire Summer Camp."
publish_to: 'none'

version: 1.2.2+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8
  hugeicons: ^1.1.7

  # State Management & DI
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  equatable: ^2.0.7
  fpdart: ^1.1.1

  # Navigation & Routing
  go_router: ^18.0.0

  # Firebase Suite
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_messaging: ^16.6.0
  firebase_crashlytics: ^5.3.0
  firebase_analytics: ^12.6.0

  # Local Notifications
  flutter_local_notifications: ^22.3.0

  # Authentication Providers
  google_sign_in: ^7.2.0

  # UI / UX Utilities
  sizer: ^3.1.2
  cached_network_image: ^4.0.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  flutter_svg: ^2.0.17
  flutter_markdown_plus: ^1.0.12

  # Security & Storage
  flutter_secure_storage: ^10.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - shorebird.yaml
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
