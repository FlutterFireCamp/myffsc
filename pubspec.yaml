name: myffsc
description: "My FFSC - Application officielle du portail apprenant du FlutterFire Summer Camp."
publish_to: 'none'

version: 1.2.3+9

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  hugeicons: ^1.1.7
  sizer: ^3.1.3
  fpdart: ^1.1.0
  get_it: ^9.2.1
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  google_sign_in: ^7.2.0
  go_router: ^18.0.0
  cached_network_image: ^4.0.0
  url_launcher: ^6.3.2
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  flutter_markdown_plus: 1.0.12
  firebase_crashlytics: ^5.3.0
  firebase_analytics: ^12.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#070A13"
  adaptive_icon_foreground: "assets/images/logo.png"
  background_color: "#070A13"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - shorebird.yaml

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 800
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 900
